name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP tests + asset build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, openssl, pdo, pdo_sqlite, sqlite3, zip, gd, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test --parallel --no-coverage

      - name: Code style (Pint, report only)
        run: vendor/bin/pint --test || true

      - name: Dependency audit (report only)
        run: composer audit --format=summary || true
